<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f4f3f0">
  <meta name="description" content="EiFilip — so empty.">
  <title>EiFilip — So empty</title>
  <style>
    :root {
      --page: #f4f3f0;
      --surface: #fbfbfa;
      --ink: #323232;
      --border: #c9c9c6;
      --pink: #f21489;
      --cyan: #00aa9f;
      --orange: #df7a05;
      --lime: #b8c500;
      --blue: #0878ae;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      display: grid;
      place-items: center;
      min-height: 100svh;
      padding: clamp(10px, 2vh, 24px) clamp(16px, 3vw, 40px);
      background:
        radial-gradient(circle at 50% 15%, rgba(255,255,255,.92), transparent 42%),
        var(--page);
      color: var(--ink);
      font-family: "Trebuchet MS", "Avenir Next", Avenir, system-ui, sans-serif;
    }

    .empty-state {
      position: relative;
      width: min(1050px, 100%);
      min-height: min(clamp(390px, 56vw, 560px), calc(100svh - 32px));
      display: grid;
      grid-template-columns: minmax(0, 1.14fr) minmax(230px, .86fr);
      align-items: center;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 9px;
      box-shadow:
        0 1px 2px rgba(0,0,0,.09),
        0 18px 50px rgba(62,58,47,.06);
    }

    .brand-tab {
      position: absolute;
      z-index: 3;
      left: 0;
      top: 50%;
      translate: -43% -50%;
      rotate: -90deg;
      padding: 7px 13px 6px;
      border-radius: 3px 3px 0 0;
      background: #2d2d2d;
      color: #fff;
      font: 700 11px/1 system-ui, sans-serif;
      letter-spacing: .06em;
      text-transform: lowercase;
    }

    .meme {
      position: relative;
      width: min(520px, 100%);
      aspect-ratio: 1.08;
      justify-self: end;
      margin-left: 22px;
    }

    .doge {
      position: absolute;
      z-index: 1;
      width: 58%;
      height: auto;
      left: 39%;
      top: 15%;
      filter: drop-shadow(0 7px 7px rgba(64,48,21,.14));
      user-select: none;
      -webkit-user-drag: none;
    }

    .meme-word {
      position: absolute;
      z-index: 2;
      margin: 0;
      font-weight: 800;
      line-height: .94;
      letter-spacing: -.045em;
      text-shadow: 0 1px 0 rgba(255,255,255,.9);
      white-space: nowrap;
    }

    .no-page {
      top: 9%;
      left: 35%;
      color: var(--pink);
      font-size: clamp(23px, 3.1vw, 39px);
      text-align: center;
    }

    .wow {
      top: 27%;
      left: 12%;
      color: var(--cyan);
      font-size: clamp(28px, 4.4vw, 53px);
      rotate: -2deg;
    }

    .such-404 {
      top: 45%;
      left: 1%;
      color: var(--orange);
      font-size: clamp(26px, 4vw, 49px);
      rotate: 1deg;
    }

    .go-back {
      top: 63%;
      left: 13%;
      color: var(--lime);
      font-size: clamp(19px, 2.8vw, 34px);
      line-height: 1.12;
      text-align: center;
      rotate: 2deg;
    }

    .very-lost {
      top: 82%;
      left: 24%;
      color: var(--blue);
      font-size: clamp(19px, 2.7vw, 33px);
      rotate: -1deg;
    }

    .message {
      align-self: center;
      padding: 36px clamp(30px, 7vw, 90px) 36px clamp(34px, 5vw, 70px);
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 6vw, 76px);
      font-weight: 400;
      line-height: .98;
      letter-spacing: -.055em;
      text-wrap: balance;
    }

    @media (max-width: 720px) {
      .empty-state {
        min-height: min(720px, calc(100svh - 32px));
        grid-template-columns: 1fr;
        grid-template-rows: minmax(330px, 1fr) auto;
      }

      .meme {
        width: min(480px, 94%);
        justify-self: center;
        margin: 14px 0 0;
      }

      .message {
        align-self: end;
        padding: 14px 30px 42px;
        text-align: center;
      }

      h1 { font-size: clamp(43px, 13vw, 66px); }
    }

    @media (max-width: 420px) {
      body { padding: 10px; }
      .empty-state { min-height: calc(100svh - 20px); }
      .brand-tab { display: none; }
      .meme { width: 100%; }
      .doge { width: 57%; }
    }
  </style>
</head>
<body>
  <main class="empty-state" aria-labelledby="empty-title">
    <span class="brand-tab" aria-hidden="true">eifilip.cz</span>

    <section class="meme" aria-label="A playful Doge empty-state illustration">
      <p class="meme-word no-page" aria-hidden="true">so no<br>page</p>
      <p class="meme-word wow" aria-hidden="true">wow</p>
      <p class="meme-word such-404" aria-hidden="true">such 404</p>
      <p class="meme-word go-back" aria-hidden="true">much<br>go back</p>
      <p class="meme-word very-lost" aria-hidden="true">very lost</p>
      <img class="doge" src="assets/doge.png" alt="Doge looking mildly surprised">
    </section>

    <section class="message">
      <h1 id="empty-title">So empty</h1>
    </section>
  </main>
</body>
</html>
